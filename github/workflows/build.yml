name: Gerar APK e EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: filosofia-game-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar o jogo para a pasta desktop
        shell: bash
        run: cp -r www desktop/www
      - name: Instalar e gerar o EXE
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: filosofia-game-windows-exe
          path: desktop/dist/*.exe
